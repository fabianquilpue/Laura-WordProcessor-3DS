name: Build Laura - Word Processor 3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm || true
          pacman -S --noconfirm 3ds-bannertool 3ds-smdhtool 3ds-tools python python-pillow ttf-dejavu || true

      - name: Prepare Assets and Fonts
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/typewriter.ttf ]; then
            cp /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf assets/fonts/typewriter.ttf || true
          fi
          python3 tools/generate_assets.py

      - name: Compile Homebrew (.3dsx and .cia)
        run: |
          make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Laura-WordProcessor-3DS
          path: |
            Laura.3dsx
            Laura.cia
            Laura.smdh
