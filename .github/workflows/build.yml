name: Build Laura - Word Processor 3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect devkitPro environment and Build
        run: |
          echo "=== Variables de entorno ==="
          env | grep -i devkit || true

          echo "=== Buscando 3ds.h y citro2d.h en el contenedor ==="
          find /opt/devkitpro -name "3ds.h" -o -name "citro2d.h" -o -name "libcitro2d.a" 2>/dev/null || true

          mkdir -p assets/fonts data
          python3 tools/generate_assets.py
          make
