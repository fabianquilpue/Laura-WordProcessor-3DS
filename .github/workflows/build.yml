name: Build Laura - Word Processor 3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dependencies and Build
        run: |
          mkdir -p assets/fonts data
          python3 tools/generate_assets.py
          
          # Limpiar y recrear directorios para evitar estados corruptos
          rm -rf /opt/devkitpro/libctru /opt/devkitpro/portlibs/3ds
          mkdir -p /opt/devkitpro/portlibs/3ds/include /opt/devkitpro/portlibs/3ds/lib
          mkdir -p /opt/devkitpro/libctru/include /opt/devkitpro/libctru/lib
          
          # Descargar e instalar libctru
          echo "Descargando e instalando libctru..."
          curl -sL https://github.com/devkitPro/libctru/archive/refs/heads/master.tar.gz | tar -xz
          cp -r libctru-master/include/* /opt/devkitpro/libctru/include/
          [ -d libctru-master/lib ] && cp -r libctru-master/lib/* /opt/devkitpro/libctru/lib/ || true
          rm -rf libctru-master

          # Descargar citro2d
          echo "Descargando citro2d..."
          curl -sL https://github.com/devkitPro/citro2d/archive/refs/heads/master.tar.gz | tar -xz
          cp -r citro2d-master/include/* /opt/devkitpro/portlibs/3ds/include/ || true
          rm -rf citro2d-master

          # Descargar citro3d
          echo "Descargando citro3d..."
          curl -sL https://github.com/devkitPro/citro3d/archive/refs/heads/master.tar.gz | tar -xz
          cp -r citro3d-master/include/* /opt/devkitpro/portlibs/3ds/include/ || true
          rm -rf citro3d-master

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Laura-WordProcessor-3DS
          path: |
            Laura.3dsx
            Laura.cia
            Laura.smdh
