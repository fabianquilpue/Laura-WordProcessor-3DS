name: Build Laura - Word Processor 3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Laura 3DS
        run: |
          # Buscar dónde está instalado elf23ds en todo el sistema e incluirlo en el PATH
          ELF23DS_PATH=$(find /opt/devkitpro -name "elf23ds" 2>/dev/null || true)
          if [ -n "$ELF23DS_PATH" ]; then
            export PATH="$(dirname "$ELF23DS_PATH"):$PATH"
            echo "Encontrado elf23ds en: $(dirname "$ELF23DS_PATH")"
          else
            echo "Advertencia: elf23ds no encontrado mediante find, buscando herramientas alternativas..."
            export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/3ds/bin:$PATH
          fi

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          
          mkdir -p assets/fonts data
          python3 tools/generate_assets.py
          make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Laura-WordProcessor-3DS
          path: |
            Laura.3dsx
            Laura.cia
            Laura.smdh
