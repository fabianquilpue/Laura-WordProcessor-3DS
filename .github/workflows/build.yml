name: Build Laura - Word Processor 3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          # Instalar Python y Pillow mediante el gestor del sistema (pacman)
          pacman -Syu --noconfirm
          pacman -S --noconfirm python python-pillow python-pip
          
          # Instalar librerías de desarrollo para la 3DS mediante dkp-pacman
          dkp-pacman -S --noconfirm citro2d citro3d libctru 3dstools || true

      - name: Build Laura 3DS
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          
          mkdir -p assets/fonts data
          python3 tools/generate_assets.py
          make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Laura-WordProcessor-3DS
          path: |
            Laura.3dsx
            Laura.cia
            Laura.smdh
