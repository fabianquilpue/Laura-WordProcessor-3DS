name: Build Laura - Word Processor 3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup devkitPro
        uses: devkitPro/actions/setup-devkitpro@v1
        with:
          packages: 3ds-dev citro2d citro3d

      - name: Build Laura 3DS
        run: |
          mkdir -p assets/fonts data
          python3 tools/generate_assets.py
          make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Laura-WordProcessor-3DS
          path: |
            Laura.3dsx
            Laura.cia
            Laura.smdh
