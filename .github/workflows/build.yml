name: Build Laura - Word Processor 3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dkp-pacman -S --noconfirm dkp-pacman devkitpro-keyring || true
          dkp-pacman -Syu --noconfirm || true
          dkp-pacman -S --noconfirm citro2d citro3d libctru 3dstools
          pacman -S --noconfirm python || true

      - name: Build Laura 3DS
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          
          mkdir -p assets/fonts data
          python3 tools/generate_assets.py
          make

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Laura-WordProcessor-3DS
          path: |
            Laura.3dsx
            Laura.cia
            Laura.smdh
